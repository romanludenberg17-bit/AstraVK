# AstraVK experimental configuration
# This file is intentionally conservative. Values are only enabled when
# the corresponding AstraVK feature exists in the build.

# Mobile profile: auto | turnip | performance | compatibility
astravk.profile = auto

# Keep upstream behavior unless an AstraVK optimization is explicitly enabled.
astravk.experimental = false

# Diagnostics / HUD are controlled by normal DXVK mechanisms.
# DXVK_HUD=full

# Shader/pipeline cache behavior remains compatible with upstream DXVK.
# Do not delete or relocate the Wine/Winlator cache automatically.
