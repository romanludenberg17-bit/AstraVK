# AstraVK experimental configuration
# Configuration scaffold only: these keys are NOT wired into DXVK yet.
# Do not expect runtime behavior to change until the source integration lands.

# Mobile profile: auto | turnip | performance | compatibility
astravk.profile = auto

# Memory profile: memory-safe | balanced | performance
# Proposed policy only; not implemented in the current scaffold.
astravk.memory_profile = memory-safe

# Keep upstream behavior until an AstraVK optimization is explicitly enabled.
astravk.experimental = false

# Future memory-budget controls (proposed; not yet implemented):
# astravk.memory_budget = auto
# astravk.transient_pool_limit_mb = auto
# astravk.pipeline_cache_limit_mb = auto
# astravk.resource_diagnostics = false

# Diagnostics / HUD are controlled by normal DXVK mechanisms.
# DXVK_HUD=full

# Do not delete or relocate the Wine/Winlator shader cache automatically.
